{{- $id := .Get "id" | default (.Get 0) -}}
{{- $title := .Get "title" | default "Video" -}}
<div class="video">
  <iframe src="https://player.vimeo.com/video/{{ $id }}?badge=0&autopause=0&player_id=0" title="{{ $title }}" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
